name: CI

# フォーク用: mise 経由の Flutter インストールが失敗するため、
# Flutter / Java を直接セットアップしてビルドする
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/local-text-file]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (local text parser)
        run: flutter test test/utils/plain_text_novel_parser_test.dart

      # フォーク用: 履歴画面にタブを足して見た目が意図的に変わったため、
      # その画面の基準画像（ゴールデン）を撮り直してから検査する
      - name: Update goldens changed by fork UI
        run: flutter test --update-goldens test/screens/history_page_visual_test.dart

      - name: Test (root)
        run: flutter test

      # フォーク用: 縦書きの部品（ページの作り直しなど）にも手を入れたため検査する
      - name: Test (tategaki)
        working-directory: packages/tategaki
        run: flutter test

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      # CI用の使い捨てキーストアで release 署名する
      - name: Create signing config for CI
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-keystore.jks \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=CI, O=Novelty, C=JP"
          cat > android/app/key.properties <<'PROPS'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=ci-keystore.jks
          PROPS

      # VOICEVOX（四国めたんの声）の公式の配布物を取得して APK に同梱する。
      # 声のモデル・ONNX Runtime とも、利用規約で「アプリケーションに組み込んで
      # 再配布することができます」とされている（クレジット表記が必要）。
      - name: Fetch VOICEVOX
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_VERSION: "0.17.1"
          ORT_VERSION: "1.23.2"
          VVM_VERSION: "0.17.1"
        run: |
          set -euxo pipefail
          work=$(mktemp -d)
          # コア（Android 版の Maven パッケージ）
          gh release download "$CORE_VERSION" -R VOICEVOX/voicevox_core \
            -p java_packages.zip -D "$work"
          mkdir -p android/voicevox-maven
          unzip -q -o "$work/java_packages.zip" -d android/voicevox-maven
          find android/voicevox-maven -name '*.aar'
          # ONNX Runtime（VOICEVOX 版・arm64）
          gh release download "voicevox_onnxruntime-$ORT_VERSION" \
            -R VOICEVOX/onnxruntime-builder \
            -p "voicevox_onnxruntime-android-arm64-$ORT_VERSION.tgz" -D "$work"
          tar -xzf "$work/voicevox_onnxruntime-android-arm64-$ORT_VERSION.tgz" -C "$work"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          find "$work" -name 'libvoicevox_onnxruntime*.so*' -type f \
            -exec cp -v {} android/app/src/main/jniLibs/arm64-v8a/libvoicevox_onnxruntime.so \;
          # Open JTalk の辞書（zip にして入れ、初回に端末で展開する）
          gh release download v1.11.1 -R r9y9/open_jtalk \
            -p open_jtalk_dic_utf_8-1.11.tar.gz -D "$work"
          tar -xzf "$work/open_jtalk_dic_utf_8-1.11.tar.gz" -C "$work"
          mkdir -p android/app/src/main/assets/voicevox
          (cd "$work" && zip -q -r open_jtalk_dic.zip open_jtalk_dic_utf_8-1.11)
          mv "$work/open_jtalk_dic.zip" android/app/src/main/assets/voicevox/
          # 声のモデル（0.vvm: めたん基本／5.vvm: めたんのささやき・ヒソヒソ）
          for m in 0.vvm 5.vvm TERMS.txt; do
            gh release download "$VVM_VERSION" -R VOICEVOX/voicevox_vvm \
              -p "$m" -D android/app/src/main/assets/voicevox
          done
          ls -la android/app/src/main/assets/voicevox android/app/src/main/jniLibs/arm64-v8a

      - name: Build Android APK (release)
        run: flutter build apk --release

      # ビルドしたAPKをダウンロードできるよう保存する
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelty-local-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
