name: CI

# フォーク用: mise 経由の Flutter インストールが失敗するため、
# Flutter / Java を直接セットアップしてビルドする
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/local-text-file]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test (local text parser)
        run: flutter test test/utils/plain_text_novel_parser_test.dart

      - name: Test (root)
        run: flutter test

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      # CI用の使い捨てキーストアで release 署名する
      - name: Create signing config for CI
        run: |
          keytool -genkeypair \
            -keystore android/app/ci-keystore.jks \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=CI, O=Novelty, C=JP"
          cat > android/app/key.properties <<'PROPS'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=ci-keystore.jks
          PROPS

      - name: Build Android APK (release)
        run: flutter build apk --release

      # ビルドしたAPKをダウンロードできるよう保存する
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: novelty-local-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
